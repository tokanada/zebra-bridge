# Installed as /etc/modprobe.d/blacklist-appliance.conf.
#
# This is an offline Bluetooth/USB appliance.  Skipping unused drivers keeps
# udev coldplug short and saves RAM on a 512 MB Pi Zero 2 W.
#
# DO NOT blacklist:
#   btbcm, hci_uart, bluetooth  -- required for the onboard BT UART
#   usblp                        -- creates /dev/usb/lp0 for the printer
#   bcm2835_wdt                  -- required for watchdog recovery
#   dwc2                         -- required for USB host mode

# Wi-Fi (the hardware is disabled by dtoverlay=disable-wifi as well)
blacklist brcmfmac
blacklist brcmutil
blacklist cfg80211

# Audio
blacklist snd_bcm2835
blacklist snd_pcm
blacklist snd_timer
blacklist snd

# Video / DRM / camera / codec
blacklist vc4
blacklist drm_kms_helper
blacklist drm
blacklist cec
blacklist v3d
blacklist bcm2835_v4l2
blacklist bcm2835_codec
blacklist bcm2835_isp
blacklist bcm2835_mmal_vchiq
