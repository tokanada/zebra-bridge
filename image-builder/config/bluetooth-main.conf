# Installed as /etc/bluetooth/main.conf.
#
# The bridge is a BLE GATT peripheral: Rock connects to the advertised GATT
# service without pairing or bonding.  Consequently there is no link-key state
# to persist, and JustWorksRepairing/DiscoverableTimeout are not used.
[General]
# Reverse service discovery makes iOS disconnect from peripheral-only devices.
ReverseServiceDiscovery = false

[Policy]
AutoEnable = true

[LE]
# Apple-friendly connection parameters recommended by the bridge README.
# If the running BlueZ ignores these keys, defaults are used.
MinConnectionInterval = 12
MaxConnectionInterval = 24
ConnectionLatency = 0
ConnectionSupervisionTimeout = 500
