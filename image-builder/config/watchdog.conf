# Installed as /etc/systemd/system.conf.d/99-watchdog.conf.
#
# The BCM2835 watchdog's hardware maximum is just under 16 seconds
# (PM_WDOG_TIME_SET is 0xfffff and the register keeps seconds in the upper
# 16 bits).  Keep these values at 15s or less; systemd cannot extend the
# hardware timeout.
[Manager]
RuntimeWatchdogSec=10s
RebootWatchdogSec=15s
