# Installed as /etc/systemd/journald.conf.d/99-persistent.conf in the debug
# image.  The debug root filesystem is writable, so logs survive reboots.
# Remove this drop-in before shipping a production image.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=16M
RuntimeMaxUse=32M
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
Compress=yes
