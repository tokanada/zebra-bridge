# /boot/firmware/zebra-bridge-debug.conf
#
# TEMPORARY DEBUG IMAGE ONLY.  This file is read at every boot by
# zebra-bridge-debug-network.service.  Edit it from any PC by mounting the
# FAT32 bootfs partition, or on the Pi at /boot/firmware when the bootfs is
# mounted read-write (the debug image mounts it read-write).
#
# This file is world-readable on the SD card.  Use a throw-away Wi-Fi
# password and change the SSH password before putting the Pi on an untrusted
# network.

[debug]
# Wi-Fi network the Pi should join.  Leave wifi_ssid empty to skip Wi-Fi.
# The profile is rewritten from this file on every boot.
wifi_ssid =
wifi_password =

# Two-letter ISO 3166-1 country code for the Wi-Fi regulatory domain.
wifi_country = US

# Set to true only for a hidden SSID.
wifi_hidden = false

# SSH account.  The account is created at boot if it does not exist.
ssh_user = pi

# Plain-text SSH password.  CHANGE THIS before booting on a shared network.
ssh_password = zebra

# Optional SSH public key (one line, e.g. ssh-ed25519 AAAA...).  Key login is
# enabled in addition to password login.
ssh_authorized_key =
